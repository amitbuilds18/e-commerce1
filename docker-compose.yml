version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: stylehub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stylehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/config/schema.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stylehub_server
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stylehub
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: stylehub_super_secret_jwt_key_2026
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # 3. Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stylehub_client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
